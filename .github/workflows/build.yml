name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          unzip -o *.zip -d project || true
          PROJECT_DIR=$(find project -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Phonecare"
          include(":app")
          EOF
          sed -i 's/id("com.android.application")/id("com.android.application") version "8.5.2"/g' app/build.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.android")/id("org.jetbrains.kotlin.android") version "2.0.21"/g' app/build.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.plugin.compose")/id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"/g' app/build.gradle.kts
          sed -i 's/1.9.24/2.0.21/g' app/build.gradle.kts
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCare-APK
          path: "**/app-debug.apk"
