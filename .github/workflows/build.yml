name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          unzip -o *.zip -d project || true
          PROJECT_DIR=$(find project -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          echo "=== BEFORE FIX - app file ==="
          cat app/build.gradle.kts
          echo "=== FIXING ==="
          sed -i 's/id("com.android.application")/id("com.android.application") version "8.5.2"/g' app/build.gradle.kts
          sed -i "s/id('com.android.application')/id('com.android.application') version '8.5.2'/g" app/build.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.android")/id("org.jetbrains.kotlin.android") version "1.9.24"/g' app/build.gradle.kts
          sed -i "s/id('org.jetbrains.kotlin.android')/id('org.jetbrains.kotlin.android') version '1.9.24'/g" app/build.gradle.kts
          echo "=== AFTER FIX - app file ==="
          cat app/build.gradle.kts
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCare-APK
          path: "**/app-debug.apk"
